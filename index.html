<style>
/* 版式：固定顶栏 → 稿件台 → 左侧流程轨 ＋ 右侧工作面板。墨色与朱批取自中文法律出版传统。 */
:root{
  --paper:#F4F6F8; --panel:#FFFFFF; --sunk:#F9FAFB; --veil:rgba(255,255,255,.82);
  --ink:#0E1116; --ink-2:#444D59; --ink-3:#7D8694; --ink-4:#AAB2BD;
  --line:#E3E7EC; --line-2:#EEF1F4;
  --ind:#14407A; --ind-2:#2665AC; --ind-3:#E9F1FA;
  --ver:#9E2F20; --ver-2:#FAEDEA;
  --jade:#19654A; --jade-2:#E8F3EE;
  --amb:#845410; --amb-2:#FAF1DE;
  --sh-1:0 1px 2px rgba(14,17,22,.05);
  --sh-2:0 1px 2px rgba(14,17,22,.04),0 4px 12px rgba(14,17,22,.06);
  --sh-3:0 2px 6px rgba(14,17,22,.05),0 14px 40px rgba(14,17,22,.1);
  --r:12px; --r-s:8px; --r-xs:6px;
  --serif:"Noto Serif SC",Songti SC,SimSun,Georgia,serif;
  --sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B0E12; --panel:#13171D; --sunk:#0F1319; --veil:rgba(19,23,29,.82);
  --ink:#EAEEF4; --ink-2:#A6AFBC; --ink-3:#6F7885; --ink-4:#555E6A;
  --line:#242A33; --line-2:#1B2027;
  --ind:#7FB2EE; --ind-2:#A2C9F7; --ind-3:#11253C;
  --ver:#E08A72; --ver-2:#351A14;
  --jade:#6AC49B; --jade-2:#0F2B1E;
  --amb:#D7A65B; --amb-2:#2E220F;
  --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 2px 10px rgba(0,0,0,.45); --sh-3:0 16px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0B0E12; --panel:#13171D; --sunk:#0F1319; --veil:rgba(19,23,29,.82);
  --ink:#EAEEF4; --ink-2:#A6AFBC; --ink-3:#6F7885; --ink-4:#555E6A;
  --line:#242A33; --line-2:#1B2027;
  --ind:#7FB2EE; --ind-2:#A2C9F7; --ind-3:#11253C;
  --ver:#E08A72; --ver-2:#351A14;
  --jade:#6AC49B; --jade-2:#0F2B1E;
  --amb:#D7A65B; --amb-2:#2E220F;
  --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 2px 10px rgba(0,0,0,.45); --sh-3:0 16px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;line-height:1.65;margin:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4,h5{font-family:var(--serif);margin:0;text-wrap:balance;letter-spacing:.005em}
button{font:inherit;cursor:pointer;transition:all .16s var(--ease)}
input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--ind-3);color:var(--ind)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-4);background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* 顶栏 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--veil);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--veil)}
.top-in{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:14px}
.brand{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:.1em;display:flex;align-items:center;gap:11px;color:var(--ink)}
.seal{background:var(--ver);color:#fff;border-radius:4px;padding:4px 9px 5px;font-size:16px;letter-spacing:.2em;line-height:1.1;box-shadow:inset 0 -1px 0 rgba(0,0,0,.14)}
.tagline{color:var(--ink-3);font-size:12px;letter-spacing:.06em;padding-left:18px;border-left:1px solid var(--line)}
.topright{margin-left:auto;display:flex;align-items:center;gap:12px}
.pill{font-size:12px;font-family:var(--mono);color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--panel)}
.pill.live{color:var(--jade);border-color:color-mix(in srgb,var(--jade) 35%,transparent);background:var(--jade-2)}
.pill.off{color:var(--ink-4)}

/* 稿件台 */
.desk{background:var(--sunk);border-bottom:1px solid var(--line)}
.desk-in{display:grid;grid-template-columns:1.5fr 1.2fr auto;gap:20px;padding-block:16px;align-items:end}
.lbl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.13em;color:var(--ink-3);margin-bottom:7px;text-transform:uppercase}
.desk .status{font-size:12px;color:var(--ink-2);white-space:nowrap;padding-bottom:10px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-4);flex:0 0 auto}
.dot.on{background:var(--jade);box-shadow:0 0 0 3px var(--jade-2)}
.uprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upbtn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 15px;font-size:13.5px;color:var(--ink-2);box-shadow:var(--sh-1)}
.upbtn:hover{border-color:var(--ind);color:var(--ind);transform:translateY(-1px);box-shadow:var(--sh-2)}

/* 期刊选择器 */
.jpick{position:relative}
.jpick>button{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 34px 9px 13px;font-size:13.5px;color:var(--ink);box-shadow:var(--sh-1);position:relative;min-height:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jpick>button:hover{border-color:var(--ind)}
.jpick>button::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:translateY(-70%) rotate(45deg)}
.jpick .sub{color:var(--ink-3);font-size:12px;margin-left:8px}
.jmenu{position:absolute;z-index:40;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-3);max-height:min(62vh,440px);display:flex;flex-direction:column;overflow:hidden;animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.jmenu input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 14px;box-shadow:none;background:transparent;font-size:13.5px}
.jmenu input:focus{outline:0;border-bottom-color:var(--ind)}
.jlist{overflow-y:auto;padding:6px}
.jlist .jg{font-size:10.5px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;padding:10px 10px 5px;font-weight:700}
.jcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px 6px}
.jlist button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:var(--r-xs);padding:7px 10px;color:var(--ink);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jlist button:hover,.jlist button.cur{background:var(--ind-3)}
.jlist button em{font-style:normal;font-family:var(--serif);font-weight:500}
.jlist button small{margin-left:auto;color:var(--ink-3);font-size:10.5px;font-family:var(--mono);white-space:nowrap}

/* 骨架 */
.shell{display:grid;grid-template-columns:250px 1fr;gap:30px;padding-block:28px 72px;align-items:start}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;flex-direction:column;gap:1px}
.railhd{font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;font-weight:700;padding:0 12px 10px}
.rail button{position:relative;display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:center;text-align:left;background:none;border:0;border-radius:var(--r-s);padding:10px 12px;color:var(--ink-2);width:100%;min-width:0}
.rail .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);letter-spacing:.02em;transition:color .16s}
.rail .t{font-family:var(--serif);font-weight:500;font-size:15px;color:var(--ink);display:block;line-height:1.4}
.rail .s{font-size:10.5px;color:var(--ink-3);display:block;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail button:hover{background:var(--line-2)}
.rail button[aria-current="true"]{background:var(--ind-3)}
.rail button[aria-current="true"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ind)}
.rail button[aria-current="true"] .n,.rail button[aria-current="true"] .t{color:var(--ind)}
.rail button[data-done="1"] .n::after{content:"●";color:var(--jade);font-size:7px;position:relative;top:-5px;left:2px}
.rail button:focus-visible{outline:2px solid var(--ind);outline-offset:1px}
.railfoot{margin-top:18px;padding:12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-3);line-height:1.7}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--sh-2);animation:rise .22s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel-hd{padding:24px 28px 20px;border-bottom:1px solid var(--line-2)}
.panel-hd h2{font-size:21px;font-weight:700;letter-spacing:.01em}
.panel-hd .lede{margin:9px 0 0;color:var(--ink-2);font-size:13.5px;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta2{margin-top:11px;font-size:10.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:0 0}
.meta2 span{white-space:nowrap;padding:0 13px;border-left:1px solid var(--line);line-height:1.4}
.meta2 span:first-child{padding-left:0;border-left:0}
.panel-bd{padding:24px 28px 30px}
.note{font-size:12px;color:var(--ink-3);line-height:1.75;border-left:2px solid var(--line);padding-left:13px;margin:20px 0 0}

/* 表单 */
.field{margin-bottom:18px;min-width:0}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 13px;font-size:13.5px;box-shadow:var(--sh-1);transition:border-color .16s,box-shadow .16s}
textarea{font-family:var(--mono);font-size:13.5px;line-height:1.85;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--ink-4)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ind);box-shadow:0 0 0 3px var(--ind-3)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>*{flex:1 1 200px;min-width:0}
.btn{background:var(--ind);color:#fff;border:0;border-radius:var(--r-s);padding:10px 19px;font-weight:500;font-size:13.5px;box-shadow:var(--sh-1)}
.btn:hover{background:var(--ind-2);transform:translateY(-1px);box-shadow:var(--sh-2)}
.btn:active{transform:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:var(--panel);color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--ind);border-color:var(--ind);background:var(--panel)}
.btn.live{background:var(--ver)}
.btn.live:hover{background:color-mix(in srgb,var(--ver) 86%,#fff)}
.btn:focus-visible{outline:2px solid var(--ind);outline-offset:2px}
.btnbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow-y:auto;padding:8px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-s)}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;background:var(--panel);color:var(--ink-2)}
.chip:hover{border-color:var(--ind);color:var(--ind)}
.chip[aria-pressed="true"]{background:var(--ind);border-color:var(--ind);color:#fff;font-weight:500}
.chip.auto{border-style:dashed}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--ink-4);width:100%;margin:10px 0 2px;padding-left:3px;text-transform:uppercase}
.tabs{display:flex;gap:0;margin-bottom:14px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-s);padding:3px;width:fit-content;max-width:100%;flex-wrap:wrap}
.tabs button{border:0;background:none;border-radius:5px;padding:6px 15px;font-size:13.5px;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ind);font-weight:500;box-shadow:var(--sh-1)}
.box{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:17px 19px;margin-bottom:20px}
.box h4{font-size:13.5px;margin-bottom:9px;display:flex;align-items:center;gap:8px}

/* 结果 */
.result{margin-top:26px;border-top:1px solid var(--line-2);padding-top:22px;animation:rise .2s var(--ease)}
.verdict{display:flex;gap:13px;align-items:baseline;flex-wrap:wrap;margin-bottom:18px}
.score{font-family:var(--mono);font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.025em}
.verdict .lab{font-size:13.5px;color:var(--ink-2)}
.finding{border:1px solid var(--line);border-left-width:3px;border-radius:var(--r-s);padding:13px 16px;margin-bottom:10px;background:var(--panel);transition:box-shadow .16s}
.finding:hover{box-shadow:var(--sh-2)}
.finding.err{border-left-color:var(--ver)}
.finding.warn{border-left-color:var(--amb)}
.finding.ok{border-left-color:var(--jade)}
.finding .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:3px 8px;border-radius:4px;white-space:nowrap;line-height:1.25}
.tag.err{background:var(--ver-2);color:var(--ver)}
.tag.warn{background:var(--amb-2);color:var(--amb)}
.tag.ok{background:var(--jade-2);color:var(--jade)}
.tag.rule{background:var(--line-2);color:var(--ink-3)}
.finding .msg{font-size:13.5px;font-weight:500;line-height:1.5}
.finding .ex{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:9px;line-height:1.85;word-break:break-word;background:var(--sunk);border-radius:var(--r-xs);padding:9px 11px}
.finding .ex b{color:var(--ver);font-weight:500;text-decoration:line-through}
.finding .ex i{color:var(--jade);font-style:normal;font-weight:500}
.finding .ex em{font-style:normal;color:var(--ink-3)}

.tablewrap{overflow:auto;margin-top:9px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--panel);max-height:560px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;min-width:580px}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line-2);vertical-align:top}
thead th{position:sticky;top:0;z-index:2;background:var(--sunk);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);font-weight:700;white-space:nowrap;text-transform:uppercase;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--sunk)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;min-width:50px;margin-top:5px}
.bar i{display:block;height:100%;background:var(--ind);border-radius:2px;transition:width .4s var(--ease)}

.tier{margin-bottom:26px}
.tier h3{font-size:15px;display:flex;gap:10px;align-items:baseline;margin-bottom:11px;flex-wrap:wrap}
.badge{font-family:var(--sans);font-size:10.5px;letter-spacing:.11em;padding:3.5px 10px;border-radius:4px;font-weight:700}
.b-rush{background:var(--ver-2);color:var(--ver)}
.b-main{background:var(--ind-3);color:var(--ind)}
.b-safe{background:var(--jade-2);color:var(--jade)}
.tier h3 small{font-weight:400;font-family:var(--sans);color:var(--ink-3);font-size:12px}

.referees{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:15px}
.ref{border:1px solid var(--line);border-radius:var(--r);padding:17px 18px;background:var(--panel);min-width:0;box-shadow:var(--sh-1);transition:box-shadow .18s,transform .18s}
.ref:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.ref h4{margin:0 0 5px;font-size:15px}
.ref .who{font-size:12px;color:var(--ink-3);margin-bottom:9px;line-height:1.55}
.ref .stance{font-size:12px;color:var(--ind);background:var(--ind-3);display:inline-block;padding:3px 10px;border-radius:4px;margin-bottom:12px;line-height:1.5}
.ref ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.ref li{margin-bottom:7px;line-height:1.55}
.ref li.bad::marker{color:var(--ver)}
.ref li.good::marker{color:var(--jade)}
.ref .call{margin-top:13px;font-size:12px;font-weight:700;padding-top:11px;border-top:1px solid var(--line-2)}

.empty{color:var(--ink-3);font-size:13.5px;padding:18px 0}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:11px;margin-bottom:22px}
.metric{border:1px solid var(--line);border-radius:var(--r-s);padding:13px 15px;background:var(--sunk)}
.metric .v{font-family:var(--mono);font-size:21px;font-variant-numeric:tabular-nums;line-height:1.2;letter-spacing:-.015em}
.metric .k{font-size:10.5px;color:var(--ink-3);margin-top:4px;letter-spacing:.05em}
.picker{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:18px}
.more{margin-top:14px;border-top:1px solid var(--line-2);padding-top:10px}
.more>summary{font-size:12px;color:var(--ink-3);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px}
.more>summary::before{content:"＋";font-family:var(--mono);color:var(--ink-4)}
.more[open]>summary::before{content:"－"}
.more>summary:hover{color:var(--ind)}
.sec{margin-bottom:26px}
.sec>h3{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);margin:0 0 12px;text-transform:none}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(236px,1fr));gap:12px;margin:0}
.paths.two{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.path{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:19px 20px 17px;text-align:left;box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:9px;transition:box-shadow .18s,transform .18s,border-color .18s}
.path:hover{border-color:var(--ind);transform:translateY(-2px);box-shadow:var(--sh-2)}
.path[aria-pressed="true"]{border-color:var(--ind);box-shadow:0 0 0 1px var(--ind),var(--sh-2)}
.path .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink-4);text-transform:uppercase}
.path .h{font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--ink);line-height:1.4}
.path .sub{font-size:13.5px;color:var(--ind);line-height:1.5}
.path .d{font-size:12px;color:var(--ink-3);line-height:1.75}
.path .go{margin-top:auto;padding-top:11px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-2)}
.path .go b{color:var(--ind);font-weight:500}
.steps{display:grid;gap:7px;margin-top:4px}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:11px;align-items:center;border:1px solid var(--line);border-radius:var(--r-s);background:var(--panel);padding:10px 14px;font-size:13.5px;color:var(--ink-2);text-align:left;width:100%}
.step:hover{border-color:var(--ind)}
.step .i{font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
.step .nm{font-family:var(--serif);font-size:15px;color:var(--ink)}
.step .nm small{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-left:9px}
.step .st{font-size:10.5px;font-family:var(--mono);color:var(--ink-4);white-space:nowrap}
.step[data-done="1"] .st{color:var(--jade)}
.step[data-opt="1"]{background:var(--sunk);opacity:.82}
.rail button[data-opt="1"] .t{color:var(--ink-2)}
.rail button[data-opt="1"] .n::before{content:"·";margin-right:1px;color:var(--ink-4)}
.crumb{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 14px;margin-bottom:18px}
.crumb b{color:var(--ink-2);font-weight:500}
.crumb .lk{color:var(--ind);background:none;border:0;padding:0;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.jreco{display:grid;gap:8px;margin-top:4px}
.jrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r-s);background:var(--panel);padding:11px 15px}
.jrow .nm{font-family:var(--serif);font-size:15px}
.jrow .mt{font-family:var(--mono);font-size:12px;color:var(--ind)}
.jrow .btn{padding:6px 14px;font-size:12px}
.picker button{flex:1 1 270px;border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;background:var(--panel);text-align:left;color:var(--ink-2);font-size:13.5px;line-height:1.45;box-shadow:var(--sh-1)}
.picker button span{display:block;font-size:12px;color:var(--ink-3);margin-top:4px}
.picker button[aria-pressed="true"]{border-color:var(--ind);box-shadow:0 0 0 1px var(--ind),var(--sh-1);color:var(--ind);font-weight:500}
.letter{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:18px;overflow:hidden;box-shadow:var(--sh-1)}
.letter>header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line-2);background:var(--sunk);flex-wrap:wrap}
.letter h5{font-size:15px;font-family:var(--serif);font-weight:600}
.letter header .d{font-size:12px;color:var(--ink-3)}
.letter header .btn{margin-left:auto;padding:5px 13px;font-size:12px}
.letter .body{font-family:var(--serif);font-size:15px;line-height:2.1;padding:26px 30px;white-space:pre-wrap;color:var(--ink);letter-spacing:.012em;max-height:520px;overflow:auto}
.letter .body .sig{display:block;text-align:right}
.pre{font-family:var(--mono);font-size:12px;line-height:1.95;white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-s);padding:15px 17px;margin-top:14px;max-height:380px;overflow:auto;word-break:break-word}

.srcbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.srcchip{border:1px solid var(--line);border-radius:999px;padding:4px 13px;font-size:12px;background:var(--panel);color:var(--ink-2)}
.srcchip b{font-family:var(--mono);color:var(--ind);font-weight:500;margin-left:4px}
.srcchip.zero{opacity:.38}
.docview{border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);max-height:500px;overflow:auto;padding:28px 24px}
.docview .pg{max-width:42em;margin:0 auto;font-size:13.5px;line-height:1.95;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:34px 38px;box-shadow:var(--sh-3)}
.docview .ti{font-family:var(--serif);font-size:16.5px;font-weight:700;text-align:center;margin-bottom:20px;text-indent:0;line-height:1.5}
.docview p{margin:0 0 .5em;text-indent:2em}
.docview sup{color:var(--ver);font-family:var(--mono);font-size:10.5px;vertical-align:super}
.docview .sect{border-top:1px solid var(--line);margin-top:22px;padding-top:13px}
.docview .sect h5{font-size:10.5px;letter-spacing:.13em;color:var(--ink-3);margin:0 0 9px;font-family:var(--sans);text-indent:0;text-transform:uppercase;font-weight:700}

/* ===== 分享版：页面自带联网取文 + 可选的自备模型密钥 ===== */
(function(){
  const KEY='ts_dsk';
  const getKey=()=>{try{return localStorage.getItem(KEY)||''}catch(e){return ''}};

  /* --- 联网：依次尝试三个公开取文服务，任一成功即返回纯文本 --- */
  const READERS=[
    {n:'r.jina.ai', u:x=>'https://r.jina.ai/'+x,                              html:false},
    {n:'allorigins', u:x=>'https://api.allorigins.win/raw?url='+encodeURIComponent(x), html:true},
    {n:'corsproxy', u:x=>'https://corsproxy.io/?'+encodeURIComponent(x),      html:true}
  ];
  function strip(h){
    try{
      const d=new DOMParser().parseFromString(h,'text/html');
      d.querySelectorAll('script,style,noscript,svg').forEach(e=>e.remove());
      return (d.body?d.body.textContent:'').replace(/[ \t ]+/g,' ')
        .split('\n').map(x=>x.trim()).filter(Boolean).join('\n');
    }catch(e){ return String(h).replace(/<[^>]+>/g,' '); }
  }
  window.__toushiNet=async function(url){
    const errs=[];
    for(const r of READERS){
      try{
        const ac=new AbortController(); const tm=setTimeout(()=>ac.abort(),20000);
        const res=await fetch(r.u(url),{signal:ac.signal,headers:{'accept':'text/plain,text/html,*/*'}});
        clearTimeout(tm);
        if(!res.ok){ errs.push(r.n+' '+res.status); continue; }
        let txt=await res.text();
        if(r.html) txt=strip(txt);
        txt=(txt||'').trim();
        if(txt.length>80) return txt;
        errs.push(r.n+' 返回内容过短');
      }catch(e){ errs.push(r.n+' '+(e.name==='AbortError'?'超时':(e.message||'失败'))); }
    }
    throw new Error('三个公开取文服务都没能取回这个页面（'+errs.join('；')+'）。可能是校园网或该站点的限制，换个网络再试，或改用完整版。');
  };

  /* --- 模型：同学自己的 DeepSeek 密钥，只存在他本机浏览器 --- */
  async function ds(prompt,opt){
    opt=opt||{};
    const key=getKey(); if(!key) throw new Error('尚未填入 DeepSeek 密钥');
    const model=opt.modelTier==='complex'?'deepseek-reasoner':'deepseek-chat';
    let r;
    try{
      r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',
        headers:{'content-type':'application/json','authorization':'Bearer '+key},
        body:JSON.stringify({model,messages:[{role:'user',content:prompt}],stream:false,temperature:.3})});
    }catch(e){ throw new Error('浏览器无法直接访问 DeepSeek 接口（可能被跨域策略或网络拦截）。规则类功能不受影响；要用模型请改用完整版。'); }
    if(!r.ok){ const m=await r.text().catch(()=>''); throw new Error('DeepSeek 返回 '+r.status+'：'+m.slice(0,160)); }
    const j=await r.json();
    const text=((j.choices||[])[0]||{}).message?.content||'';
    if(opt.onText) try{opt.onText({text})}catch(e){}
    return {text};
  }
  ds.json=async function(prompt,opt){
    const {text}=await ds(prompt+'\n\n只输出 JSON，不要任何解释文字，不要代码块标记。',opt);
    const s=text.replace(/^[\s\S]*?```(?:json)?/,'').replace(/```[\s\S]*$/,'').trim()||text.trim();
    const a=s.indexOf('['), o=s.indexOf('{');
    const st=(a>=0&&(o<0||a<o))?a:o;
    const en=Math.max(s.lastIndexOf(']'),s.lastIndexOf('}'));
    return JSON.parse(st>=0&&en>st?s.slice(st,en+1):s);
  };
  window.claude={use:async k=>k==='sample'?(getKey()?ds:null):null};

  addEventListener('DOMContentLoaded',()=>{
    const ap=document.getElementById('aiPill'); if(!ap) return;
    const paint=()=>{ const has=!!getKey();
      ap.textContent=has?'模型 · DeepSeek（点此更换）':'模型 · 点此填入你的密钥';
      ap.className='pill '+(has?'live':'off'); ap.style.cursor='pointer';
      ap.title='密钥只保存在你这台电脑的浏览器里，不会上传到任何服务器'; };
    ap.onclick=()=>{
      const cur=getKey();
      const k=window.prompt('粘贴你自己的 DeepSeek API 密钥（platform.deepseek.com 申请）。\n密钥只保存在本机浏览器，不会上传。\n留空并确定＝清除密钥。',cur);
      if(k===null) return;
      try{ k.trim()?localStorage.setItem(KEY,k.trim()):localStorage.removeItem(KEY); }catch(e){}
      location.reload();
    };
    setTimeout(paint,300); setTimeout(paint,1200);
  });
})();

  return hit;
}

/* 汉字数字 → 阿拉伯数字 */
const CN={零:0,〇:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
function cn2ar(s){
  if(/^[0-9]+$/.test(s)) return s;
  let total=0,section=0,num=0;
  for(const ch of s){
    if(ch in CN){ num=CN[ch]; }
    else if(ch==='十'){ section += (num||1)*10; num=0; }
    else if(ch==='百'){ section += (num||1)*100; num=0; }
    else if(ch==='千'){ section += (num||1)*1000; num=0; }
    else if(ch==='万'){ total += (section+num)*10000; section=0; num=0; }
  }
  return String(total+section+num);
}

        refs.push({no:n?+n:refs.length+1,text:L.replace(NUM_HEAD,'').trim(),raw:L}); } return; }
    const m=L.match(NUM_HEAD);
    if(m&&looksLikeCitation(L)&&L.length>14){ const n=(m[1]||m[2]||m[3]||m[4]||m[5]);
      numbered.push({no:n?+n:numbered.length+1,text:L.replace(NUM_HEAD,'').trim(),raw:L}); return; }
    body.push(L);
    for(const c of harvestCitations(L)) inline.push({no:inline.length+1,text:c,from:i});
  });
  return {body,refs,numbered,inline};
}
async function loadManuscript(file){
  let raw='',parts;

    const d=await parseDocx(file); parts=digest(d.body);
    MS.foot=d.foot; MS.end=d.end; raw=d.body.join('\n');
  }else if(/\.doc$/i.test(file.name)){
    const d=parseDoc(await file.arrayBuffer()); parts=digest(d.body);
    MS.foot=d.foot; MS.end=d.end; raw=d.body.join('\n');
  }else{
    raw=await file.text();

function checkPassage(txt){
  const out=[];
  const add=(lv,msg,ex)=>out.push({lv,msg,ex});
  if(/^(近年来|随着|当今|在当今|伴随|在.{0,8}背景下)/.test(txt.trim()))
    add('err','以背景起笔','法学刊中以「近年来／随着」开头的不足一成。改成条文或判断起笔。');
  const weak=[...txt.matchAll(/(篇幅所限|限于篇幅|有待进一步研究|尚待深入|挂一漏万|不足之处)/g)].map(m=>m[0]);
  if(weak.length) add('err','示弱表述：'+[...new Set(weak)].join('、'),'删去。适用范围放进论证里一句话交代。');
  const jar=[...txt.matchAll(/(赋能|抓手|闭环|多维度|全方位|深入探讨|日益凸显|不容忽视|具有重要的理论意义|保驾护航|提质增效)/g)].map(m=>m[0]);
  if(jar.length) add('warn','公文腔或 AI 常用语：'+[...new Set(jar)].join('、'),'逐个换成具体表述：说清究竟做了什么、变了多少。');
  const me=[...txt.matchAll(/(本文|笔者)/g)].length;
  if(me>Math.max(2,txt.length/500)) add('warn',`「本文／笔者」出现 ${me} 次`,'改用「应当」「宜」直接给出规范判断。');
  const prec=[...txt.matchAll(/第\s*[0-9一二三四五六七八九十百]+\s*条\s*第\s*[0-9一二三四五六七八九十]+\s*[款项]/g)].length;
  const loose=[...txt.matchAll(/《[^》]{2,24}法》(?!\s*第)/g)].length;
  if(loose>prec) add('warn',`有 ${loose} 处只写了法律名称，写到条款项的只有 ${prec} 处`,'把「《××法》的相关规定」改到条款项。');
  const byS=[...txt.matchAll(/[一-龥]{2,4}(?:教授)?认为/g)].length;
  if(byS>=2) add('warn',`有 ${byS} 处以「某某认为」起句`,'改成「××说认为」，学者姓名放进脚注。');
  const solid=[...txt.matchAll(/(第\s*[0-9一二三四五六七八九十百]+\s*条|人民法院|案号|〔\d{4}〕|\d+(\.\d+)?%|\d{2,}\s*(份|例|件))/g)].length;
  const per=txt.length?solid/(txt.length/300):0;
  if(txt.length>200&&per<1) add('err',`每 300 字只有 ${per.toFixed(1)} 个可核对项`,'改后的段落应当每 300 字有五六个条款号、法院、数字或学说名称。');
  else if(txt.length>200) add('ok',`每 300 字有 ${per.toFixed(1)} 个可核对项`,'这个密度是法学论文的正常区间。');
  if(/(肯定说|否定说|折中说|通说|有力说|少数说)/.test(txt)) add('ok','出现了学说立场的表述','继续写清谁是通说、本文站在哪一边。');
  return out;
}

function intakeRows(){
  const j=curJ(); if(!hasMs()||!j) return null;
  const m=msMetrics(), std=j.std;
  const notes=allNotes();
  const issues=notes.length?runRules(notes.map(n=>std==='gb'?(n.raw||n.text):n.text).join('\n'),std):[];
  const err=issues.filter(x=>x.rule.level==='err').length;
  const warn=issues.length-err;
  const topics=topicsFromTitle(MS.title||'');
  const inScope=topics.filter(a=>j.topics.includes(a.s)).length;
  const R=(k,v,st,why)=>({k,v,st,why});
  const lenOk=m.chars>=j.lo&&m.chars<=j.hi;
  return [
    R('篇幅',`${m.chars.toLocaleString()} 字`, lenOk?'ok':(m.chars<j.lo*.7||m.chars>j.hi*1.4?'err':'warn'),
      `本刊常见篇幅 ${(j.lo/1000)}–${(j.hi/1000)} 千字${lenOk?'，在区间内':(m.chars<j.lo?'，偏短':'，偏长')}`),
    R('引注数量',`${m.notes} 条`, m.notes>=20?'ok':(m.notes>=8?'warn':'err'),
      `每千字 ${m.density.toFixed(1)} 条${m.density>=1.5?'，密度正常':'，密度偏低，核心主张可能缺乏文献支撑'}`),

function touchesDept(x,d){ if(x.d===d) return true;

const normLib=()=>SEED_NORMS.concat(userNorms());
function mergeNorms(arr,src){
  const cur=userNorms(),key=x=>(x.src||'')+'|'+(x.t||'');
  const seen=new Set(SEED_NORMS.concat(cur).map(key)); let add=0;
  for(const r of arr){ if(!r||!r.t||!r.src) continue;
    const row={d:DEPTS.includes(r.d)?r.d:'法理与法史',s:r.s||'',t:String(r.t),src:String(r.src),
      yr:+r.yr||new Date().getFullYear(),cov:+r.cov||0,
      w:typeof r.w==='number'?(r.w>1?r.w/100:r.w):.75,dt:typeof r.dt==='number'?(r.dt>1?r.dt/100:r.dt):.6};
    if(seen.has(key(row))) continue; seen.add(key(row)); cur.push(row); add++; }
  store.set('ts_norms',cur); store.set('ts_norms_meta',{at:new Date().toISOString().slice(0,10),src:src||'导入',add});
  return add; }
/* 规则层的可行性测算：四个维度各自有可核验的依据 */
/* 以最长公共子串判定选题与库内条目的关联，避免「的法律」这类虚词造成误命中 */
function lcsLen(a,b){
  let best=0;
  for(let i=0;i<a.length;i++){
    for(let n=Math.min(a.length-i,12);n>best;n--){
      if(b.indexOf(a.slice(i,i+n))>=0){ best=n; break; }
    }
  }
  return best;
}
const STOPSEG=/^(的法律|法律的|和法律|与法律|的适用|的认定|的问题|的制度|的规则|研究的|的研究)$/;
function matchNorm(topic){
  const t=String(topic).replace(/[\s，。、；：（）()《》"'']/g,'');
  let best=null,bestLen=0;
  for(const x of normLib()){
    const key=[x.t,x.s,x.src,x.d].join('');
    let n=lcsLen(t,key);
    if(n>=3&&n<=4){
      /* 命中太短时，确认它不是虚词片段 */
      let real=false;
      for(let i=0;i+n<=t.length;i++){ const seg=t.slice(i,i+n);
        if(key.indexOf(seg)>=0&&!STOPSEG.test(seg)){ real=true; break; } }
      if(!real) n=0;
    }
    if(n>bestLen){ bestLen=n; best=x; }
  }
  return bestLen>=4?{best,len:bestLen}:{best:null,len:bestLen};
}
function feasibility(topic){
  const m=matchNorm(topic), best=m.best, j=curJ();
  const norm=best?Math.min(1,.55+best.w*.45):.25;
  const cov=best?best.cov:null;
  const lit=cov===null?.5:Math.max(.15,1-cov/45);
  const data=best?best.dt:.5;
  const fit=j?(()=>{
    if(!best) return .5;
    const e=ALL_TOPICS.find(x=>x.s===best.s);
    if(j.topics.includes(best.s)) return 1;
    if(e&&j.topics.some(t=>{const g=ALL_TOPICS.find(y=>y.s===t);return g&&g.d===e.d;})) return .7;
    return ['A','B'].includes(j.tier)?.55:.4;   // 综合性法学刊栏目宽，不宜重罚
  })():.5;
  const total=.3*norm+.3*lit+.2*data+.2*fit;
  const srcName=best?String(best.src):'';   /* src 自带书名号，不再外加 */
  return {best,norm,lit,data,fit,total,cov,matchLen:m.len,
    dims:[
      {k:'规范依据充分性',v:norm,why:best?`库内命中 ${srcName}（${best.yr} 年），与选题的最长共同表述为 ${m.len} 字`

      {k:'材料可得性',    v:data,why:best?'依库内登记的材料可得性估值':'未命中库内条目，按中位值计'},

    ]};
}

      const l=userNorms(); l.push(N($('#nD').value,$('#nS').value,t,src,+$('#nY').value,+$('#nCov').value,+$('#nW').value/100,+$('#nDt').value/100));
      store.set('ts_norms',l); toast('已保存'); renderPanel(); };
    $('#rFeedGo').onclick=()=>{ const raw=$('#rFeedIn').value.trim(); if(!raw) return;
      try{ const a=JSON.parse(raw); if(!Array.isArray(a)) throw new Error('顶层应为数组');
        toast(`合并 ${mergeNorms(a,'粘贴')} 条`); renderPanel(); }catch(e){ toast('解析失败：'+e.message); } };
    if($('#rReset')) $('#rReset').onclick=()=>{store.del('ts_norms');store.del('ts_norms_meta');toast('已清空导入条目');renderPanel();};
    $('#rExp').onclick=()=>{ $('#rOut').innerHTML=`<div class="finding ok"><div class="hd"><span class="tag ok">已导出</span><span class="msg">全选复制并保存为 .json</span></div></div><div class="pre">${esc(JSON.stringify(normLib(),null,2))}</div>`; };
    $('#rImp').onchange=async e=>{const f=e.target.files[0]; if(!f)return;
      try{const a=JSON.parse(await f.text()); if(!Array.isArray(a)) throw new Error('格式应为数组');
        toast(`合并 ${mergeNorms(a,f.name)} 条`); renderPanel();}catch(err){ toast('导入失败：'+err.message); }};
    $('#rGo').onclick=()=>{
      RADAR.q=$('#rQ').value.trim(); const min=(+$('#rMin').value||0)/100;
      const gset=new Set(RADAR.useGuide?g.topics:[]);
      const gdept=new Set([...gset].map(t=>{const e=ALL_TOPICS.find(x=>x.s===t);return e?e.d:t;}));
      let rows=normLib(),crossNote='';
      if(RADAR.depts.length){
        if(RADAR.cross&&RADAR.depts.length>1){
          const sc=x=>RADAR.depts.filter(d=>touchesDept(x,d)).length;
          const full=rows.filter(x=>sc(x)===RADAR.depts.length);
          if(full.length){ rows=full; crossNote=`交叉模式：只保留同时跨越「${RADAR.depts.join('」「')}」的选题`; }
          else{ const part=rows.map(x=>({x,k:sc(x)})).filter(o=>o.k>=2).sort((a,b)=>b.k-a.k);
            if(part.length){ rows=part.map(o=>o.x); crossNote=`库中暂无跨全部 ${RADAR.depts.length} 个部门的选题，已列出跨其中 2 个以上的 ${rows.length} 条`; }
            else{ rows=rows.filter(x=>RADAR.depts.includes(x.d)); crossNote='库中暂无跨部门选题，已回退为并集'; } }
        } else rows=rows.filter(x=>RADAR.depts.includes(x.d));
      }
      if(RADAR.q) rows=rows.filter(x=>(x.t+x.s+x.src+x.d).includes(RADAR.q));
      rows=rows.map(x=>{ const nov=Math.max(0,1-x.cov/45);
        const fit=gset.size?(gset.has(x.s)?1:(gdept.has(x.d)?.5:0)):0;
        const base=.45*nov+.35*x.w+.20*x.dt;
        return {...x,nov,fit,total:gset.size?(.70*base+.30*fit):base}; })
        .filter(x=>x.total>=min).sort((a,b)=>b.total-a.total);
      const out=$('#rOut');
      if(!rows.length){ out.innerHTML='<p class="empty">没有命中的条目。放宽筛选，或录入新的规范变动。</p>'; return; }
      const onG=rows.filter(x=>x.fit>=1).length;
      out.innerHTML=`<div class="verdict"><span class="score">${rows.length}</span>
        <span class="lab">条候选选题${gset.size?` · 其中 ${onG} 条正落在《${esc(j.n)}》的方向上`:''}</span></div>
        ${crossNote?`<div class="finding ok"><div class="hd"><span class="tag ok">部门法</span><span class="msg">${esc(crossNote)}</span></div></div>`:''}
        <div class="tablewrap"><table><thead><tr><th>选题</th><th>部门 / 子主题</th><th>规范变动</th>${gset.size?'<th>刊物</th>':''}<th>新颖</th><th>可写</th><th>数据</th><th>综合</th></tr></thead>
        <tbody>${rows.slice(0,60).map(r=>`<tr>
          <td><b style="font-family:var(--serif)">${esc(r.t)}</b><div class="hint">已检索到 ${r.cov} 篇相关论文</div>
            <button class="btn ghost pickT" data-t="${esc(r.t)}" data-b="${esc(r.src)}" style="padding:3px 9px;font-size:12px;margin-top:6px">设为当前选题</button></td>
          <td style="color:var(--ink-2)">${esc(r.d)}<div class="hint">${esc(r.s)}</div></td>
          <td style="color:var(--ink-2)">${esc(r.src)}<div class="hint">${r.yr} 年</div></td>
          ${gset.size?`<td class="num" style="color:${r.fit>=1?'var(--jade)':r.fit>0?'var(--amb)':'var(--ink-4)'}">${r.fit>=1?'正中':r.fit>0?'同部门':'—'}</td>`:''}
          <td class="num">${pct(r.nov)}<div class="bar"><i style="width:${pct(r.nov)}%"></i></div></td>
          <td class="num">${pct(r.w)}</td><td class="num">${pct(r.dt)}</td>
          <td class="num" style="font-weight:700;color:var(--ind)">${pct(r.total)}</td></tr>`).join('')}</tbody></table></div>
        <p class="note">${gset.size?'综合分 ＝ 0.70 × 基础分 ＋ 0.30 × 刊物契合；基础分 ＝ 0.45 新颖度 ＋ 0.35 可写度 ＋ 0.20 数据可得性。':'综合分 ＝ 0.45 新颖度 ＋ 0.35 可写度 ＋ 0.20 数据可得性。'}
        检索覆盖篇数为库内登记值，可手工维护、联网更新或批量导入。选定某条后，可在「可行性论证」与「相似研究与创新性」两栏中继续论证。</p>`;
      $$('.pickT').forEach(btn=>btn.onclick=()=>{ setTopic(btn.dataset.t,'空白清单',btn.dataset.b); renderPanel(); });
    };
    $('#rGo').click();
  }};
}

    const near=normLib().filter(x=>[x.t,x.s,x.d].join('').includes(seed.slice(0,3))||seed.includes(x.s)).slice(0,25);
    const libTxt=(near.length?near:normLib().slice(0,25)).map(x=>`${x.d}/${x.s}｜${x.t}｜依据：${x.src}（${x.yr}）｜已检索 ${x.cov} 篇`).join('\n');

${j?`目标期刊：《${j.n}》。刊物定位：${j.style}。栏目方向：${(d.topics||[]).join('、')}`:'未指定目标期刊，按中文法学核心期刊的通行标准。'}

${libTxt}

          <div class="hd"><span class="tag rule">${i+1}</span>

          <div class="ex">${x.basis?`规范依据：<i>${esc(x.basis)}</i><br>`:'<em>模型未给出明确规范依据，写作前须自行核实立法或司法解释出处。</em><br>'}
            ${x.why?`可写之处：${esc(x.why)}<br>`:''}${x.risk?`可能受质疑：${esc(x.risk)}`:''}</div></div>`).join('')+

function bindFeas(j){

      <div class="verdict"><span class="score" style="color:${f.total>=.7?'var(--jade)':f.total>=.45?'var(--amb)':'var(--ver)'}">${pct(f.total)}</span>

      <div class="metrics">${f.dims.map(d=>`<div class="metric"><div class="v" style="color:var(--${lvl(d.v)==='ok'?'jade':lvl(d.v)==='warn'?'amb':'ver'})">${pct(d.v)}</div><div class="k">${esc(d.k)}</div></div>`).join('')}</div>

  $('#feasGo').onclick=()=>{ const r=draw(); if(r) store.set('ts_done_feas',1); };

    if(!CAP.sample) return;

      const a=await CAP.sample.json(
`请对下述法学论文选题作可行性评议，只输出 JSON，不得编造条文或文献。

选题：${r.t}
${j?`拟投刊物：《${j.n}》，刊物定位：${j.style}`:''}
系统测算：规范依据 ${pct(r.f.norm)}，学术空白 ${pct(r.f.lit)}，材料可得 ${pct(r.f.data)}，刊物契合 ${pct(r.f.fit)}
${r.f.best?`库内命中的规范变动：${r.f.best.src}（${r.f.best.yr}），相关论文已检索 ${r.f.best.cov} 篇`:'库内未命中明确规范依据'}

{"verdict":"一句话结论：是否值得推进",
 "strength":["该选题的学术价值所在，2-3 条"],
 "weakness":["推进前必须解决的问题，2-3 条"],
 "path":["具体的推进步骤，3 条，要可操作"],
 "materials":["须准备的材料或数据，2-3 条"]}`,{modelTier:'default'});
      box.innerHTML=`<h3 style="font-size:15px;margin:20px 0 11px">论证意见</h3>
        <div class="finding ok"><div class="hd"><span class="tag ok">结论</span><span class="msg">${esc(a.verdict||'')}</span></div></div>
        ${['strength','weakness','path','materials'].map((k,i)=>{
          const lab=['学术价值','须解决的问题','推进路径','须准备的材料'][i];
          const cls=['ok','err','warn','rule'][i];
          const arr=a[k]||[];
          return arr.length?`<div class="finding ${cls==='rule'?'warn':cls}"><div class="hd"><span class="tag ${cls}">${lab}</span></div>

function paraHits(re){const o=[];MS.body.forEach((L,i)=>{if(re.test(L))o.push({i,L});});return o;}
function firstPara(re){const h=paraHits(re);return h.length?h[0]:null;}
function cut(t,n){t=String(t).replace(/\s+/g,' ');return t.length>n?t.slice(0,n)+'…':t;}
function locus(hit,fb,lab){ if(hit) return {label:`正文第 ${hit.i+1} 段`,quote:cut(hit.L,95)};
  const i=Math.min(fb,Math.max(0,MS.body.length-1));
  return {label:lab||(MS.body.length?`正文第 ${i+1} 段`:'全文'),quote:MS.body[i]?cut(MS.body[i],95):''}; }
function msMetrics(){

  const years=[...all.matchAll(/((?:19|20)\d{2})\s*年/g)].map(m=>+m[1]);
  const y=new Date().getFullYear(),recent=years.filter(v=>v>=y-3).length;
  return {chars,notes:notes.length,foreign,
    foreignRate:notes.length?foreign/notes.length:0,
    recentRate:years.length?recent/years.length:0,
    density:chars?notes.length/(chars/1000):0,
    pStat:firstPara(/《[^》]{2,24}》\s*第\s*[0-9一二三四五六七八九十百千]+\s*条/),
    pDef:firstPara(/(是指|界定为|应当理解为|系指|所谓)/),
    pElem:firstPara(/(构成要件|要件|法律效果|请求权基础)/),
    pN:firstPara(/(\d{2,})\s*(份|例|个|件)|样本|N\s*=\s*\d+/),
    pSrc:firstPara(/(裁判文书|问卷|访谈|数据库|裁判文书网|统计年鉴|案例库)/),
    pVar:firstPara(/(变量|回归|相关性|显著|控制了|编码|交叉表)/),
    pQ:firstPara(/(问题是|本文试图|本文旨在|研究问题|亟待回答|何以|本文追问)/),
    pCause:firstPara(/(成因|原因|症结|根源|机理)/),
    pCure:firstPara(/(对策|建议|出路|完善|进路|方案)/),
    pComp:firstPara(/(德国|日本|美国|法国|欧盟|比较法|域外)/),

/* 写作层信号：供外审意见与来稿初审共用。判据取自法学 C 刊的通行写法。 */
function writingSignals(){
  const body=MS.body, text=body.join('\n'), notes=allNotes(), noteTxt=notes.map(n=>n.text).join('\n');
  const all=text+'\n'+noteTxt;
  const title=MS.title||(body[0]||'');
  const abs=(body.find(x=>/^摘\s*要/.test(x))||'').replace(/^摘\s*要\s*[:：]?\s*/,'');
  const kw=(body.find(x=>/^关键词/.test(x))||'').replace(/^关键词\s*[:：]?\s*/,'').split(/[\s　,，、;；]+/).filter(Boolean);
  const heads=body.filter(x=>/^\s*[一二三四五六七八九十]+\s*[、．.]/.test(x));
  const artFull=[...text.matchAll(/第\s*[0-9一二三四五六七八九十百]+\s*条(?:\s*第\s*[0-9一二三四五六七八九十]+\s*[款项])?/g)].length;
  const artPrec=[...text.matchAll(/第\s*[0-9一二三四五六七八九十百]+\s*条\s*第\s*[0-9一二三四五六七八九十]+\s*[款项]/g)].length;
  const lawOnly=[...text.matchAll(/《[^》]{2,24}法》(?!\s*第)/g)].length;
  const caseNo=[...all.matchAll(/[（(〔［\[]\s*(?:19|20)\d{2}\s*[）)〕］\]]\s*[^，。；\s]{0,12}[号]/g)].length;
  const court=[...all.matchAll(/(最高人民法院|[^，。；\s]{2,8}(?:高级|中级|基层)?人民法院)/g)].length;
  const doctrineMap=/(通说|多数说|有力说|少数说|主流观点|学界通行)/.test(text);
  const doctrineGroup=/(肯定说|否定说|折中说|.{1,8}说认为|.{1,8}论者认为)/.test(text);
  const byScholar=[...text.matchAll(/[一-龥]{2,4}(?:教授|学者)?认为/g)].length;
  const byView=[...text.matchAll(/[^，。；\s]{2,10}说(?:认为|主张)/g)].length;
  const compara=paraHits(/(德国|日本|美国|法国|欧盟|域外|比较法)/);
  const comeBack=compara.some(h=>{const nx=body.slice(h.i,h.i+3).join('');return /(我国|中国|本国|对我国|反观)/.test(nx);});
  const concl=body.slice(-4).join('');
  const conclKind=/(解释方案|应当解释为|宜解释为)/.test(concl)?'解释论'
    :(/(建议修改|应当增设|宜增设|修改为|立法上)/.test(concl)?'立法论'
    :(/(理论|命题|范式|法理)/.test(concl)?'理论命题':''));
  const weak=[...all.matchAll(/(篇幅所限|限于篇幅|有待进一步研究|尚待深入|囿于|受限于笔者|不足之处|挂一漏万)/g)].map(m=>m[0]);
  const jargon=[...all.matchAll(/(赋能|抓手|闭环|多维度|全方位|深入探讨|日益凸显|不容忽视|具有重要的理论意义)/g)].map(m=>m[0]);
  const bgOpen=/^(近年来|随着|当今|在当今|当前，|伴随)/.test(abs||body[1]||'');
  const futureSec=body.some(x=>/^(\s*[一二三四五六七八九十]+\s*[、．.])?\s*(不足与展望|研究展望|余论与展望)/.test(x));
  /* 连续三段以上无引注、无条文、无案例的纯议论 */
  let run=0,maxRun=0,runAt=-1;
  body.forEach((L,i)=>{ const solid=/第\s*[0-9一二三四五六七八九十百]+\s*条|人民法院|％|%|\d{2,}\s*(份|例|件)|「|“/.test(L)||L.length<40;
    if(!solid){ run++; if(run>maxRun){maxRun=run;runAt=i-run+1;} } else run=0; });
  return {title,abs,kw,heads:heads.length,artFull,artPrec,lawOnly,caseNo,court,doctrineMap,doctrineGroup,
    byScholar,byView,compara:compara.length,comeBack,conclKind,weak:[...new Set(weak)],jargon:[...new Set(jargon)],
    bgOpen,futureSec,maxRun,runAt,
    vagueTitle:/(.*研究$|.*问题研究|.*探析|.*初探|.*浅析)/.test(title),
    absLen:abs.length};
}

    bad:w.artPrec?`仅 ${w.artPrec} 处写到条款项，另有 ${w.lawOnly} 处只写了法律名称`:`通篇未见「第××条第×款」式的精确援引，另有 ${w.lawOnly} 处只写了法律名称`,
    where:locus(null,Math.floor(MS.body.length/2),'援引法律之处'),
    fix:'把「《民法典》的相关规定」一律改到条款项，首次出现的司法解释写全称与法释文号'});
  D.push({ok:w.caseNo>0||w.court>0,w:2,good:`案例写到了法院或案号（检出 ${w.court} 处法院、${w.caseNo} 处案号）`,
    bad:'出现了「有判决认为」「实践中存在争议」一类表述，但没有具体法院、年份或案号',
    where:locus(paraHits(/(有判决|实践中|司法实践)/)[0],Math.floor(MS.body.length/3)),
    fix:'要么写清法院、年份、案号或案情要点，要么删去这一处——法学审稿人不接受匿名的「有判决」'});
  D.push({ok:w.doctrineMap,w:3,good:'交代了学说版图',
    bad:'只罗列了几种观点，没有说清哪个是通说、哪个是有力说、哪个是少数说',
    where:locus(paraHits(/(学界|学者|观点|学说)/)[0],1),
    fix:'在综述处补一句版图：「就此问题，××说为通说，××说为有力说，本文采／另立××说」，再说明通说错在哪一环'});
  D.push({ok:w.doctrineGroup,w:2,good:'学说按立场分组',
    bad:'学说未按立场分组，读起来像文献清单',
    where:locus(paraHits(/(学界|学说|观点)/)[0],1),
    fix:'按肯定说、否定说、折中说分组，每组写「主张—依据—问题」三句'});
  D.push({ok:!(w.byScholar>3&&w.byScholar>w.byView),w:1,good:'以观点为主语行文',
    bad:`有 ${w.byScholar} 处以「某某认为」起句，而以观点为主语的只有 ${w.byView} 处`,
    where:locus(paraHits(/[一-龥]{2,4}认为/)[0],1),
    fix:'改成「请求权基础说认为……」，学者姓名放进脚注'});
  D.push({ok:!(w.compara>0&&!w.comeBack),w:2,good:'域外素材回到了本国问题',
    bad:'引入了域外立法例，但没有回到「对我国某条款意味着什么」，比较法段落停留在介绍',
    where:locus(paraHits(/(德国|日本|美国|欧盟|域外)/)[0],Math.floor(MS.body.length/2)),
    fix:'每段域外经验写完补一句落点，并交代为何选这个法域（继受关系、制度相似或问题先发）'});
  D.push({ok:!!w.conclKind,w:2,good:`结论落在${w.conclKind}上`,
    bad:'结论没有明确落点，收束于「应当进一步完善」一类的表述',
    where:locus(null,last,'结语'),
    fix:'明确写成三者之一：解释方案（某条应解释为……）、立法建议（某条应改为……）、理论命题，并与引言的问题对上'});
  D.push({ok:!w.weak.length,w:2,good:'没有示弱表述',
    bad:`出现示弱表述：${w.weak.slice(0,4).join('、')}`,
    where:locus(paraHits(/(篇幅所限|有待进一步研究|不足之处)/)[0],last),
    fix:'删去。适用范围放进论证里一句话交代，不在结语认错'});
  D.push({ok:w.jargon.length<=2,w:1,good:'未见明显的公文腔',
    bad:`出现公文腔或 AI 常用语：${w.jargon.slice(0,5).join('、')}`,
    where:locus(paraHits(/(赋能|抓手|多维度|全方位|日益凸显)/)[0],1),
    fix:'逐个替换为具体表述：「赋能」改成具体做了什么，「日益凸显」改成具体数据或判决'});
  D.push({ok:!w.futureSec,w:1,good:'未单开「不足与展望」',
    bad:'单列了「不足与展望」一节，法学刊少见，且会削弱结论',
    where:locus(null,last,'文末'),fix:'删去该节，把其中有价值的一两句并入结语'});
  D.push({ok:w.maxRun<4,w:2,good:'论证段与证据段交替得当',
    bad:`第 ${w.runAt+1} 段起有连续 ${w.maxRun} 段纯议论，既无条文也无案例或数据`,
    where:locus(null,Math.max(0,w.runAt),'连续议论之处'),
    fix:'在这一串议论中插入条文、判决或数据；核心判断一篇两三处即可，每处后面紧跟依据'});
  D.push({ok:w.heads>=3&&w.heads<=6,w:1,good:`一级标题 ${w.heads} 个`,
    bad:w.heads?`一级标题 ${w.heads} 个，${w.heads<3?'层次偏少，论证难以展开':'层次偏多，建议合并'}`:'未检出一级标题，或标题未用「一、二、三」的体例',
    where:{label:'全文结构',quote:`检出一级标题 ${w.heads} 个`},
    fix:'法学论文一级标题以 4–5 个为常见；按「问题—规范基础—学说检讨—本文方案—案型检验」排布'});
  R.push({name:'外审专家 丁',who:'文献、写作与成文规范 · 逐条可改',
    stance:'本栏按法学 C 刊的通行写法逐项核对，意见尽量落到具体段落',items:D});
  return R;
}

function renderReviewers(reps,verdicts,tag,m){
  const bad=reps.flatMap(r=>r.items.filter(i=>!i.ok).map(i=>({who:r.name,it:i,w:i.w||1})));
  const split=new Set(verdicts).size>1;
  return `<div class="metrics">
      <div class="metric"><div class="v">${m.chars.toLocaleString()}</div><div class="k">正文字数</div></div>
      <div class="metric"><div class="v">${m.notes}</div><div class="k">引注条数</div></div>
      <div class="metric"><div class="v">${m.density.toFixed(1)}</div><div class="k">每千字引注</div></div>
      <div class="metric"><div class="v">${pct(m.foreignRate)}%</div><div class="k">外文占比</div></div>
      <div class="metric"><div class="v">${pct(m.recentRate)}%</div><div class="k">近三年占比</div></div></div>
    <div class="referees">${reps.map((r,i)=>`<div class="ref">
      <h4>${esc(r.name)}</h4><div class="who">${esc(r.who)}</div>
      ${r.stance?`<div class="stance">${esc(r.stance)}</div>`:''}
      <ul>${r.items.map(x=>`<li class="${x.ok?'good':'bad'}">${esc(x.ok?x.good:x.bad)}</li>`).join('')}</ul>
      <div class="call" style="color:${VCOLOR[verdicts[i]]||'var(--ink)'}">处理意见：${esc(verdicts[i])}</div></div>`).join('')}</div>
    ${split?`<div class="finding warn" style="margin-top:15px"><div class="hd"><span class="tag warn">分歧</span>
      <span class="msg">${reps.length} 位评审人意见不一致：${verdicts.join(' / ')}</span></div>
      <div class="ex">分歧点往往就是论文的软肋，优先处理被两人以上提到的问题。</div></div>`:''}
    <h3 style="font-size:15px;margin:20px 0 11px">合并后的修改清单 <span class="hint" style="font-weight:400">${tag}</span></h3>
    ${bad.length?bad.sort((a,b)=>b.w-a.w).map((b,i)=>`<div class="finding ${b.w>=3?'err':'warn'}">
      <div class="hd"><span class="tag rule">${i+1}</span><span class="tag ${b.w>=3?'err':'warn'}">${esc(b.who)}</span>
        ${b.it.where?`<span class="tag rule">${esc(b.it.where.label)}</span>`:''}
        <span class="msg">${esc(b.it.bad)}</span></div>
      <div class="ex">${b.it.where&&b.it.where.quote?`稿件定位：<b style="text-decoration:none">${esc(b.it.where.quote)}</b><br>`:''}
        ${b.it.fix?`修改建议：<i>${esc(b.it.fix)}</i>`:''}</div></div>`).join('')
      :'<div class="finding ok"><div class="hd"><span class="tag ok">通过</span><span class="msg">各位评审人均无保留意见</span></div></div>'}`;
}
function viewReferee(){

   meta:j?[`实证占比 ${pct(j.emp)}%`,`篇幅 ${j.lo.toLocaleString()}–${j.hi.toLocaleString()} 字`,`周期约 ${j.wk} 周`,
           `严格度 ×${STRICT[j.tier]}`,d.from?`方向来自${d.from}`:'内置画像']:['未选择期刊'],

    <div class="tabs"><button id="tabDoc" aria-pressed="true">稿件版式</button><button id="tabTxt" aria-pressed="false">纯文本</button></div>
    <div id="docPane">${docPreview()}</div>
    <div id="txtPane" hidden><textarea rows="12" readonly>${esc(MS.body.join('\n')+(allNotes().length?'\n\n【引注】\n'+allNotes().map(n=>`${SRC_META[n.src]} ${n.no}. ${n.text}`).join('\n'):''))}</textarea></div>
    <div class="btnbar" style="margin-top:14px">
      <button class="btn" id="refGo"${hasMs()?'':' disabled'}>规则审查</button>
      <button class="btn live" id="refAI"${hasMs()&&CAP.sample?'':' disabled'}>大模型审稿（依该刊定位）</button>
      <span class="hint">${CAP.sample?'模型会读取该刊的联网情报与近期篇目来定调':'模型不可用，可先用规则审稿'}</span></div>
    <div class="result" id="refOut"></div>`,
   init(){
    ensureIntel(j);
    $('#tabDoc').onclick=()=>{$('#docPane').hidden=false;$('#txtPane').hidden=true;$('#tabDoc').setAttribute('aria-pressed','true');$('#tabTxt').setAttribute('aria-pressed','false');};
    $('#tabTxt').onclick=()=>{$('#docPane').hidden=true;$('#txtPane').hidden=false;$('#tabTxt').setAttribute('aria-pressed','true');$('#tabDoc').setAttribute('aria-pressed','false');};
    $('#refGo').onclick=()=>{
      if(!hasMs()) return;
      const m=msMetrics(),reps=buildReferees(j,m),tier=j?j.tier:'C';
      const v=reps.map(r=>verdictOf(r.items,tier));
      store.set('ts_done_referee',1);
      $('#refOut').innerHTML=renderReviewers(reps,v,'规则审查 · 本地运行',m)+
        `<p class="note">处理意见按刊物层级加严（${j?`《${esc(j.n)}》为${TIER_META[j.tier].n}刊，严格度 ×${STRICT[j.tier]}`:'默认 ×1.15'}）：同一份稿子投权威刊可能退稿，投扩展版可能只是修改后发表。</p>`;
      renderRail();
    };
    $('#refAI').onclick=async ()=>{
      if(!hasMs()||!CAP.sample) return;
      const out=$('#refOut');
      out.innerHTML=`<div class="hint"><span class="spin"></span>大模型按《${esc(j?j.n:'通用')}》的口味审稿中…</div>`+skel(6);
      const m=msMetrics();
      const prof=j?`刊名：《${j.n}》
收录：${j.lists.split('').map(c=>LIST_NAME[c]).join('、')}；层级：${TIER_META[j.tier].n}刊，严格度系数 ${STRICT[j.tier]}
刊物性格：${j.style}
方向与栏目（${d.from||'内置画像'}）：${(d.topics||[]).join('、')}
${d.style?`联网归纳的近期口味：${d.style}`:''}
${d.toc?`近期篇目：${d.toc}`:''}
实证论文占比约 ${pct(j.emp)}%；常见篇幅 ${j.lo}–${j.hi} 字；审稿周期约 ${j.wk} 周
引注体例：${j.std==='legal'?'《法学引注手册》（第二版）':'GB/T 7714—2025'}`
        :'未指定目标期刊，按中文法学核心期刊的一般标准审稿。';
      const bodyTxt=MS.body.map((L,i)=>`[第${i+1}段] ${L}`).join('\n').slice(0,14000);
      const noteTxt=allNotes().slice(0,60).map(n=>`[${SRC_META[n.src]}${n.no}] ${n.text}`).join('\n').slice(0,6000);
      const prompt=`你是中文法学期刊的匿名审稿人。严格模仿下面这本刊的审稿口味，生成四位人格不同的外审专家意见。

== 目标期刊 ==
${prof}

== 待审稿件（正文，按段编号）==
${bodyTxt}

== 稿件引注 ==
${noteTxt||'（未抽取到引注）'}

== 客观指标 ==
正文 ${m.chars} 字；引注 ${m.notes} 条；每千字 ${m.density.toFixed(1)} 条；外文占比 ${pct(m.foreignRate)}%；近三年文献占比 ${pct(m.recentRate)}%

== 要求 ==
1. 四位专家立场不同，且与这本刊的主导范式相称：实证占比高的刊以社科法学专家为主，偏教义学的刊反之；第三位是编辑部视角，管选题契合、篇幅与形式规范；第四位专管文献、学说综述与成文规范。
2. 每位专家给 6 到 10 条意见，意见要密、要细、要针对本文的具体论证，不要泛泛而谈。凡是能指出「这一段的推论缺了哪一步」「这个要件没有对应到哪类案件」「这处转述与原文献不符」的，都要写出来。
3. 每条意见必须指到具体位置：locus 写"正文第N段"或"脚注N"，quote 原样摘录该处不超过 40 字的原文。不得编造稿件里没有的内容。
4. fix 必须是作者照着就能改的动作：补哪一条法条、补哪一类案例、把哪句话改成什么、删掉哪一节。不要写"建议进一步完善"。
5. 处理意见要真实反映该刊门槛，层级越高越严，达不到水平时给"退稿"，不要一律给"修改后再审"。
6. 只输出 JSON：
[{"name":"审稿人 甲","persona":"其学术立场与为何属于这本刊","stance":"他最在意的一件事","comments":[{"severity":"major|minor","locus":"正文第3段","quote":"原文摘录","issue":"问题","fix":"怎么改"}],"verdict":"建议录用|修改后发表|修改后再审|退稿"}]`;
      try{
        const res=await CAP.sample.json(prompt,{modelTier:'complex',
          onText:({text})=>{ out.innerHTML=`<div class="hint"><span class="spin"></span>生成中…已 ${text.length} 字</div>`+skel(5); }});
        const arr=Array.isArray(res)?res:(res&&res.reviewers)||[];
        if(!arr.length) throw new Error('返回内容无法解析为审稿人数组');
        const reps=arr.map(r=>({name:r.name||'审稿人',who:r.persona||'',stance:r.stance||'',
          items:(r.comments||[]).map(c=>({ok:false,w:c.severity==='major'?3:1,bad:c.issue||'',fix:c.fix||'',
            where:{label:c.locus||'全文',quote:c.quote||''}}))}));
        store.set('ts_done_referee',1);
        out.innerHTML=renderReviewers(reps,arr.map(r=>r.verdict||'修改后再审'),`大模型 · 按《${esc(j?j.n:'通用')}》风格`,m)+
          `<p class="note">本节由大模型生成，稿件在你的浏览器内直接送往模型。模型可能漏判或误判，每条意见都给了原文落点，请对照核验。离线的规则审稿可作交叉校验。</p>`;
        renderRail();
      }catch(err){
        out.innerHTML=`<div class="finding err"><div class="hd"><span class="tag err">调用失败</span>
          <span class="msg">${esc(err&&err.message||String(err))}</span></div>
          <div class="ex"><em>可改用规则审稿，它完全离线。</em></div></div>`;
      }
    };
    if(hasMs()) $('#refGo').click();
   }};
}

/* ===================== 环节 04 摘要诊断 ===================== */
const ABS_RULES=[
 {id:'A1',t:'结论前置',ok:t=>/^(摘要[:：]?)?\s*\S{0,40}(应当|宜|须|不应|可以|属于|构成|并非|取决于)/.test(t)||/本文(主张|认为|提出)/.test(t),
  bad:'摘要没有把结论放在前面，读者读完仍不知道你的主张',fix:'第一句就写出结论，例如「限期实缴下的出资责任应定性为……」'},
 {id:'A2',t:'不写无信息的套话',ok:t=>!/(本文首先|本文其次|本文最后|文章结构如下|具有重要的理论意义和实践意义|综上所述)/.test(t),
  bad:'摘要里出现了「本文首先……其次……」或「具有重要理论与实践意义」这类无信息套话',fix:'删掉结构性叙述与空泛评价，把位置让给结论与理由'},
 {id:'A3',t:'有方法交代',ok:t=>/(裁判文书|样本|实证|规范分析|教义|比较法|案例|访谈|问卷|\d{2,}\s*份)/.test(t),
  bad:'摘要未交代研究方法或材料',fix:'一句话说清你靠什么得出结论：样本多少、用什么方法'},
 {id:'A4',t:'篇幅合度',ok:t=>t.replace(/\s/g,'').length>=150&&t.replace(/\s/g,'').length<=400,
  bad:'摘要篇幅不在中文法学期刊常见的 150–400 字区间',fix:'压到或扩到 200–350 字，这是多数刊的实际区间'},
 {id:'A5',t:'不用第一人称叙事',ok:t=>!/(笔者认为|我认为|拙文|本人)/.test(t),
  bad:'摘要中出现「笔者认为」「拙文」等表述',fix:'改为直陈判断，摘要不需要谦辞'}
];
const KW_RULES=[
 {id:'K1',t:'数量 3–5 个',ok:k=>k.length>=3&&k.length<=5,bad:k=>`关键词 ${k.length} 个，多数法学期刊要求 3–5 个`,fix:'调整到 3–5 个'},
 {id:'K2',t:'不与标题完全重复',ok:(k,ti)=>!k.every(x=>ti.includes(x)),bad:()=>'关键词全部取自标题，等于没有提供新的检索入口',fix:'换入上位概念或方法词，提高被检索到的概率'},
 {id:'K3',t:'不用泛词',ok:k=>!k.some(x=>/^(法律|法治|制度|问题|研究|对策|完善|中国)$/.test(x.trim())),bad:()=>'出现了「法律」「制度」「问题」这类泛词，没有区分度',fix:'替换为可检索的具体术语'},
 {id:'K4',t:'长度适中',ok:k=>k.every(x=>x.trim().length>=2&&x.trim().length<=12),bad:()=>'有关键词过长或过短',fix:'每个关键词控制在 2–12 字'}
];
function viewAbstract(){

   body:`
    <div class="row">

/* ===================== 环节 06 引注规范官 ===================== */
let CITE_STD=null,CITE_SRC='all';
function runRules(text,std){
  const out=[];
  for(const r of ALL_RULES[std]){
    const re=new RegExp(r.re.source,r.re.flags.includes('g')?r.re.flags:r.re.flags+'g');
    let m,g=0;
    while((m=re.exec(text))!==null&&g++<500){
      if(!m[0].trim()){re.lastIndex++;continue;}
      const line=text.slice(0,m.index).split('\n').length;
      let fixed=null; if(r.fix){const f=r.fix(m[0]); if(f!==m[0]) fixed=f;}
      out.push({rule:r,hit:m[0].trim().slice(0,130),line,fixed});
      if(m[0].length===0) re.lastIndex++;
    }
  }
  return out.sort((a,b)=>a.line-b.line||(a.rule.level==='err'?-1:1));
}
function applyFixes(t,std){ for(const r of ALL_RULES[std]) if(r.fix) t=r.fix(t); return t; }

/* ===================== 环节 07 投稿文书 ===================== */
/* 文书模板引擎：本地生成，模型只做润色。不留首行空格与空行，复制后无需再整理。 */
function msAbstract(){
  const a=MS.body.find(x=>/^摘\s*要/.test(x));
  return a?a.replace(/^摘\s*要\s*[:：]?\s*/,'').trim():'';
}
function firstSentence(t){ const m=String(t).split(/[。；]/).filter(x=>x.trim().length>8); return m.length?m[0].trim()+'。':''; }
function cnDate(){ const d=new Date(); return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`; }
function clean(lines){ return lines.filter(x=>x!==null&&x!==undefined&&String(x).trim()!=='').join('\n'); }

/* 送检前的本地自查：内部重复与模板化表述。不是知网查重，也不是 AIGC 检测。 */
const AI_MARKS=['综上所述','值得注意的是','不容忽视','具有重要的理论意义和实践意义','随着……的不断发展','在当今社会',
 '首先，其次，再次，最后','深入探讨','全面分析','有效提升','进一步完善','多维度','赋能','抓手','闭环','路径依赖',
 '具有重要意义','日益凸显','不断深化','总的来说','由此可见','需要指出的是'];
function selfCheck(){
  if(!hasMs()) return null;
  const text=MS.body.join('');
  const sents=text.split(/[。！？；]/).map(s=>s.trim()).filter(s=>s.length>=10);
  /* 内部重复：按 12 字滑窗统计重复窗口占比 */
  const W=12, seen=new Map(); let total=0, rep=0;
  const flat=text.replace(/[\s，、。；：（）()《》“”"']/g,'');
  for(let i=0;i+W<=flat.length;i+=4){ const k=flat.slice(i,i+W); total++;
    if(seen.has(k)) rep++; else seen.set(k,1); }
  const dup=total?rep/total:0;
  /* 句长整齐度：AI 文本句长方差偏小 */
  const L=sents.map(s=>s.length), mean=L.reduce((a,b)=>a+b,0)/(L.length||1);
  const sd=Math.sqrt(L.reduce((a,b)=>a+(b-mean)**2,0)/(L.length||1));
  const cv=mean?sd/mean:1;                       /* 变异系数，越小越整齐 */
  /* 模板化表述 */
  const hits=[]; AI_MARKS.forEach(w=>{ const c=text.split(w).length-1; if(c) hits.push({w,c}); });
  const markRate=sents.length?hits.reduce((a,b)=>a+b.c,0)/sents.length:0;
  /* 合成一个 0-100 的「模板化程度」，仅作自查参考 */
  const style=Math.min(100,Math.round(markRate*260+Math.max(0,(.42-cv))*150));
  return {dup:Math.round(dup*1000)/10, style, cv:Math.round(cv*100)/100,
    sents:sents.length, hits:hits.sort((a,b)=>b.c-a.c).slice(0,8)};
}
function coverVersions(j,f){
  const d=dirOf(j), m=hasMs()?msMetrics():null, abs=msAbstract();
  const title=MS.title||'（论文标题）';
  const dirs=(d.topics||[]).slice(0,4);
  const head=j?`《${j.n}》编辑部：`:'编辑部：';
  const scale=m?`正文约 ${m.chars.toLocaleString()} 字，含引注 ${m.notes} 条`:'全文另附';
  const core=f.contrib||firstSentence(abs)||'（请在此写明本文的核心结论）';
  const coreS=`${core.replace(/^本文/,'')}${/[。；]$/.test(core)?'':'。'}`;
  const std=j?(j.std==='legal'?'《法学引注手册》（第二版）':'GB/T 7714—2025'):'贵刊体例';
  const fit=j
    ? `之所以投寄贵刊，是因为${dirs.length?`贵刊长期关注${dirs.join('、')}等方向，`:''}本文所处理的问题与贵刊的栏目定位相合。${d.toc?`贵刊近期刊发的${d.toc.split(/[、，]/).slice(0,2).join('、')}等文与本文处在同一脉络，本文已在文献综述部分予以回应。`:'本文已在文献综述部分对贵刊既有相关研究作出回应。'}`
    : '（请在此说明本文为何适合贵刊：对应该刊的哪个栏目、回应了该刊既有的哪些讨论。）';
  const promise=`作者谨此承诺：本文为独立完成的原创作品，不存在一稿多投、重复发表或其他学术不端情形；所引文献均已依${std}规范标注。`;
  /* 学术检测结果：由作者填入官方检测报告的数值，系统只负责写进函里 */

            f.aiVal!==''&&f.aiVal!==undefined?`AIGC 疑似生成比例为 ${f.aiVal}%`:null].filter(Boolean);
  const detect=dt.length?`${dt.join('，')}${f.dupDate?`（检测日期：${f.dupDate}）`:''}。本文不含由生成式人工智能代为撰写的实质内容，人工智能仅用于${f.aiUse||'文字校对与格式整理'}，相关结论、论证与引注均由作者独立完成并负责。`:null;
  const sign=`${f.au?f.au.split(/[，,]/)[0]:'（作者）'} 谨上\n${cnDate()}`;
  const fund=f.fund?`本文系${f.fund}的阶段性成果。`:null;
  const bio=f.au?`作者简介：${f.au}。`:null;

  return [
   { name:'标准版', desc:'通行格式，适用于多数核心期刊，篇幅适中',
     text: clean([head,
      `兹投稿一篇，题为《${title}》，${scale}，此前未在其他刊物发表，亦未同时投寄他刊。`,
      `本文所要回答的问题是：${coreS}`,
      abs?`摘要：${abs.slice(0,240)}${abs.length>240?'……':''}`:null,
      fit, fund, bio, promise, detect,
      '如蒙刊用，作者愿按编辑部意见修改。联系方式：（电话）（电子邮箱）。',
      '顺颂编安',
      sign]) },

   { name:'简洁版', desc:'三段到底，适用于月刊、半月刊与实务类刊物',
     text: clean([head,
      `现投稿《${title}》一文，${scale}，系未刊稿，未一稿多投。`,
      `本文的核心结论是：${coreS}${j&&dirs.length?`该问题属贵刊${dirs.slice(0,2).join('、')}栏目所关注的范围。`:''}`,
      [fund,bio].filter(Boolean).join('') || null,
      `所引文献已依${std}标注。${detect?detect:''}如蒙刊用，愿按编辑部意见修改。联系方式：（电话）（电子邮箱）。`,
      sign]) },

   { name:'详尽版', desc:'交代研究方法与创新点，适用于权威刊与集刊',
     text: clean([head,
      `兹投稿一篇，题为《${title}》，${scale}，此前未在其他刊物发表，亦未同时投寄他刊。`,
      `一、本文要回答的问题。${coreS}`,
      `二、研究方法与材料。${m&&m.pN?'本文以裁判文书为样本展开实证考察，':''}${m&&m.pStat?'并在规范层面逐一检讨相关条文的构成要件与法律效果。':'主要采规范分析的方法。'}${m?`全文引注 ${m.notes} 条，其中外文文献占 ${pct(m.foreignRate)}%，近三年文献占 ${pct(m.recentRate)}%。`:''}`,
      '三、本文的推进之处。（请在此写明本文相对于既有研究的具体推进：是提出了新的解释方案，还是提供了新的经验材料，抑或纠正了通说的某一环节。此处宜具体，不宜空泛。）',
      `四、与贵刊的契合。${fit}`,
      fund, bio, promise,
      detect?`五、学术检测与人工智能使用说明。${detect}`:null,

      '顺颂编安',
      sign]) }
  ];
}

function splitReviews(t){
  const raw=String(t).replace(/\r/g,'').trim();
  if(!raw) return [];
  let parts=raw.split(/\n(?=\s*(?:审稿[人专家]?\s*[一二三四1234]|意见\s*[一二三四1234]|专家\s*[一二三四1234]|\d{1,2}\s*[.、．)）]))/);
  if(parts.length<2) parts=raw.split(/\n{2,}/);
  if(parts.length<2) parts=raw.split(/\n/);
  return parts.map(x=>x.trim()).filter(x=>x.length>6);
}
function responseVersions(j,rev){
  const items=splitReviews(rev);
  const list=items.length?items:['（粘贴审稿意见后，系统会自动按条拆分，并为每条生成答复结构。）'];
  const head=`${j?`《${j.n}》`:''}编辑部、各位匿名审稿专家：`;
  const open=`感谢编辑部与各位审稿专家对拙稿《${MS.title||'（论文标题）'}》的审阅。各位所提意见切中要害，作者已逐条研读并据以修改。现将修改情况汇报如下，正文中的修改之处均以修订模式标出。`;
  const std=j?(j.std==='legal'?'《法学引注手册》（第二版）':'GB/T 7714—2025'):'贵刊要求';
  const tail=[`除上述修改外，作者另对全文文字与引注作了校订，引注体例已依${std}统一。`,
    '再次感谢各位专家的审阅，恳请批评指正。','作者 谨上',cnDate()];
  const block=(x,i,mode)=>clean([
    `【审稿意见 ${i+1}】${x.replace(/\n+/g,' ')}`,
    mode==='accept'
      ? '【回应】该意见切中要害，作者完全接受，并已按意见作出修改。'
      : '【回应】（三选一填写：完全接受／部分接受／不接受。部分接受时写明接受到何种程度；不接受时须说明理由并给出替代方案，不宜回避。）',
    '【修改位置】（写明正文第 X 段、第 X 节或脚注 X。务必指到具体位置，便于专家复核。）',
    '【修改内容】（摘录修改后的文字，或概述所作的实质调整。）']);
  return [
   { name:'全面接受版', desc:'适用于意见均可接受的情形，逐条填写修改位置即可',
     text: clean([head,open,...list.map((x,i)=>block(x,i,'accept')),...tail]) },
   { name:'含异议版', desc:'示范如何礼貌地不接受某条意见，附替代方案的写法',
     text: clean([head,open,...list.map((x,i)=>block(x,i,'mixed')),
      '附：关于不予采纳之处的说明。对第 X 条意见，作者经复核后认为（此处写明理由，例如：该问题已在第 X 段以另一方式处理／所涉材料不在本文论证射程之内／采该方案将与第 X 部分的结论冲突）。作为折中，作者已在第 X 段补充（替代方案），以回应该意见所关切的问题。',
      ...tail]) }
  ];
}

function renderLetters(list,note){
  store.set('ts_done_letter',1);
  const box=$('#lOut');
  box.innerHTML=list.map((v,i)=>`<div class="letter">
      <header><h5>${esc(v.name)}</h5><span class="d">${esc(v.desc)}</span>
        <button class="btn ghost lcp" data-i="${i}">复制</button></header>
      <div class="body" id="lb${i}">${esc(v.text)}</div></div>`).join('')
    +(note?`<p class="note">${esc(note)}</p>`:'');
  $$('.lcp',box).forEach(b=>b.onclick=async()=>{
    const t=list[+b.dataset.i].text;
    try{ await navigator.clipboard.writeText(t); toast(`已复制「${list[+b.dataset.i].name}」`); }
    catch(e){ const r=document.createRange(); r.selectNodeContents($('#lb'+b.dataset.i));
      const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('已选中，请按 Ctrl/Cmd+C 复制'); }
  });
  renderRail();
}

/* 按稿件或标题快速推荐刊物，用于「还没有目标刊」时的即时出口 */
function recoJournals(n){
  const auto=topicsFromTitle(MS.title||'');
  const chosen=(MSEL.length?MSEL:auto.map(a=>a.s)).map(s=>{
    const e=ALL_TOPICS.find(x=>x.s===s); return {s,d:e?e.d:''};});
  if(!chosen.length) return [];
  const m=hasMs()?msMetrics():null;
  const emp=m?(m.pVar?.85:(m.pN?.6:.35)):.4, len=m?m.chars:16000;
  const deptsOf=j=>new Set(j.topics.map(x=>{const e=ALL_TOPICS.find(y=>y.s===x);return e?e.d:x;}));
  return JOURNALS.map(j=>{
    const jd=deptsOf(j); let hit=0;
    for(const c of chosen){ if(j.topics.includes(c.s)) hit+=1; else if(c.d&&jd.has(c.d)) hit+=.55; }
    const sT=Math.min(1,hit/chosen.length), sM=1-Math.abs(emp-j.emp);
    const sL=len>=j.lo&&len<=j.hi?1:Math.max(0,1-(len<j.lo?(j.lo-len)/j.lo:(len-j.hi)/j.hi));
    return {j,sT,total:.55*sT+.25*sM+.20*sL};
  }).filter(x=>x.sT>0).sort((a,b)=>b.total-a.total).slice(0,n||5);
}
function jExit(id){
  const r=recoJournals(5);
  return `<div class="box"><h4>还没有目标期刊</h4>
    <p class="hint" style="margin:0 0 12px">${MS.title||hasMs()
      ?'下面是按当前稿件主题即时算出的候选，点一下即设为目标刊；完整的十项测算在「刊物适配」。'
      :'先在上方填入论文标题或上传稿件，这里就会给出候选刊。'}</p>
    ${r.length?`<div class="jreco" id="${id}">${r.map(x=>`<div class="jrow">
      <div><div class="nm">《${esc(x.j.n)}》</div><div class="hint">${TIER_META[x.j.tier].n} · ${x.j.wk} 周</div></div>
      <div class="mt">契合 ${pct(x.sT)}</div>
      <button class="btn ghost" data-j="${esc(x.j.n)}">设为目标刊</button></div>`).join('')}</div>`:''}

      <button class="btn" data-goto="match">去刊物适配做完整测算</button></div></div>`;
}
function bindJExit(){
  $$('[data-j]').forEach(b=>b.onclick=()=>{ MS.journal=b.dataset.j; store.set('ts_journal',MS.journal);
    renderJPick(); renderPanel(); toast(`目标期刊：《${MS.journal}》`); });
}
function viewStart(){
  const r=ROUTES[ROUTE], j=curJ(), ed=ROLE==='editor';
  const ready=k=>k==='ms'?(hasMs()||!!MS.title):(k==='j'?!!j:true);
  const stepList=(ids,opt,note)=>`<div class="steps">${ids.map((id,i)=>{const v=VIEWS.find(x=>x.id===id);let d=false;try{d=v.done();}catch(e){}
      const o=!!opt;
      return `<button class="step" data-goto="${id}" data-done="${d?1:0}" data-opt="${o?1:0}">
        <span class="i">${o?'—':'0'+(i+1)}</span>
        <span class="nm">${v.n}<small>${v.s}</small></span>
        <span class="st">${d?'已完成':(o?(note||'可跳过'):'')}</span></button>`;}).join('')}</div>`;
  return { title:'开始',
   lede:'先说清你是谁、手上有什么，左侧的环节会按这个顺序重排',
   meta:[ROLE?ROLES[ROLE].n:'未选身份', hasMs()?`稿件 ${msChars().toLocaleString()} 字`:'未载入稿件', j?`《${esc(j.n)}》`:'未选刊物'],
   body:`
   <div class="sec"><h3>一、你是谁</h3>
     <div class="paths two">${Object.entries(ROLES).map(([k,v])=>`
       <button class="path" data-role="${k}" aria-pressed="${ROLE===k}">
         <span class="h">${v.n}</span><span class="sub">${v.s}</span>
         <span class="d">${v.d}</span>
         <span class="go">${v.steps} 个环节${ROLE===k?' · 当前':''}</span></button>`).join('')}</div></div>
   ${ROLE==='author'?`<div class="sec"><h3>二、你走到哪一步了</h3>
     <div class="paths">${Object.entries(ROUTES).map(([k,v])=>`
       <button class="path" data-r="${k}" aria-pressed="${ROUTE===k}">
         <span class="k">路径 ${v.k}</span><span class="h">${v.n}</span><span class="sub">${v.s}</span>
         <span class="go">从 <b>${VIEWS.find(x=>x.id===v.flow[0]).n}</b> 开始${ROUTE===k?' · 当前':''}</span></button>`).join('')}</div></div>`:''}
   ${ed?`<div class="sec"><h3>二、编辑台的六个环节</h3>
     <p class="hint" style="margin:-2px 0 12px">在上方把「目标期刊」选为你所在的刊物，各环节即以该刊的标准审查来稿。</p>
     ${!j?`<div class="finding warn"><div class="hd"><span class="tag warn">先做一步</span><span class="msg">在上方选定本刊</span></div></div>`:''}
     ${stepList(EDITOR_FLOW,false)}</div>`:''}
   ${(ROLE==='author'&&r)?`<div class="sec"><h3>三、路径 ${r.k} 的顺序</h3>
     ${!ready(r.need)?`<div class="finding warn"><div class="hd"><span class="tag warn">先做一步</span><span class="msg">${esc(r.needtip)}</span></div></div>`:''}
     ${stepList(r.flow,false)}
     ${r.later&&r.later.length?`<div class="hint" style="margin:14px 0 8px">${esc(r.laterN||'稍后再做')}</div>${stepList(r.later,true,r.laterN)}`:''}
     <div class="btnbar" style="margin-top:14px"><button class="btn" data-goto="${r.flow[0]}">从${VIEWS.find(x=>x.id===r.flow[0]).n}开始</button>
       <span class="hint">随时回本页换路径，做过的环节不会清空</span></div></div>`:''}
   ${!ROLE?'<p class="empty">先选一个身份。</p>':''}`,
   init(){
     $$('[data-role]').forEach(b=>b.onclick=()=>{ ROLE=b.dataset.role; store.set('ts_role',ROLE);
       if(ROLE==='editor'){ renderDesk(); renderRail(); renderPanel(); }
       else { renderDesk(); renderRail(); renderPanel(); }
       toast(ROLES[ROLE].n); });
     $$('[data-r]').forEach(b=>b.onclick=()=>{ ROUTE=b.dataset.r; store.set('ts_route',ROUTE);
       renderRail(); renderPanel(); toast(`路径 ${ROUTES[ROUTE].k}·${ROUTES[ROUTE].n}`);
       setTimeout(()=>{ location.hash=ROUTES[ROUTE].flow[0]; },240); });
     bindJExit();
   }};
}

/* ===================== 路由 ===================== */
const VIEWS=[
 {id:'start',   n:'开始',       s:'选身份与起点，流程随之重排', make:viewStart,    done:()=>!!ROLE},
 {id:'radar',   n:'选题论证',   s:'找题、验证可写性与创新性', make:viewRadar,    done:()=>!!store.get('ts_topic',0)},
 {id:'intel',   n:'刊物研判',   s:'锁定目标刊的定位与用稿标准', make:viewIntel,    done:()=>!!(curJ()&&getIntel(curJ().n))},
 {id:'outline', n:'写作框架',   s:'按研究进路搭结构', make:viewOutline,  done:()=>!!store.get('ts_done_outline',0)},
 {id:'howto',   n:'行文自查',   s:'写的过程中逐段自查', make:viewHowto,   done:()=>!!store.get('ts_done_howto',0)},
 {id:'abstract',n:'摘要审查',   s:'摘要结构与关键词规范', make:viewAbstract, done:()=>!!store.get('ts_done_abstract',0)},
 {id:'referee', n:'外审意见',   s:'外审专家逐条提出修改意见', make:viewReferee,  done:()=>!!store.get('ts_done_referee',0)},
 {id:'match',   n:'刊物适配',   s:'按稿件推荐期刊并排投稿顺序', make:viewMatch,    done:()=>!!store.get('ts_done_match',0)},
 {id:'cite',    n:'引注合规',   s:'双标准引注审查与校正', make:viewCite,     done:()=>!!store.get('ts_done_cite',0)},
 {id:'letter',  n:'投稿文书',   s:'投稿函、答复函与检测告知', make:viewLetter,   done:()=>!!store.get('ts_done_letter',0)},
 {id:'track',   n:'投稿管理',   s:'投稿状态与审理时限',   make:viewTrack,    done:()=>!!SUBS().length},
 {id:'eintake', n:'来稿初审',   s:'形式审查与受理门槛',   make:viewIntake,   done:()=>!!store.get('ts_done_intake',0)},
 {id:'efit',    n:'栏目归口',   s:'来稿进哪个栏目、是否撞题', make:viewFit,   done:()=>!!store.get('ts_done_fit',0)},
 {id:'edecide', n:'处理与函件', s:'退修、退稿与录用通知',   make:viewDecide,   done:()=>!!store.get('ts_done_decide',0)}
];
function FLOW(){
  const r=ROUTES[ROUTE];
  const ids=['start'].concat(ROLE==='editor'?EDITOR_FLOW:(r?r.flow.concat(r.later||[]):DEFAULT_FLOW));
  return ids.map(id=>VIEWS.find(v=>v.id===id)).filter(Boolean);
}
function isLater(id){ const r=ROUTES[ROUTE]; return !!(r&&ROLE!=='editor'&&(r.later||[]).includes(id)); }
function flowLabel(){ return ROLE==='editor'?'编辑台':(ROUTES[ROUTE]?`路径 ${ROUTES[ROUTE].k}·${ROUTES[ROUTE].n}`:'默认顺序'); }
const OKID=/^[a-z][a-z0-9-]*$/;
function current(){const h=(location.hash||'').replace(/^#/,'');
  return VIEWS.some(v=>v.id===h&&OKID.test(h))?h:FLOW()[0].id;}
function crumb(id){
  const r0=ROUTES[ROUTE];
  const fl=FLOW().filter(v=>v.id!=='start'&&!isLater(v.id)), ids=fl.map(v=>v.id), i=ids.indexOf(id);
  const opt=isLater(id);
  const back=`<button class="lk" data-goto="start" style="margin-left:auto">${ROLE?'换身份或路径':'选起点'}</button>`;
  if(i<0) return `<div class="crumb"><b>${flowLabel()}</b> · 本环节不在这条流程里，可单独使用${back}</div>`;
  if(opt) return `<div class="crumb"><b>${flowLabel()}</b> · ${esc((ROUTES[ROUTE]||{}).laterN||'这一轮可跳过')}，先做主线的环节也可以${back}</div>`;
  const nx=ids[i+1], nm=k=>{const v=VIEWS.find(x=>x.id===k);return v?v.n:'';};
  return `<div class="crumb"><b>${flowLabel()}</b> · ${opt?'本轮可跳过':`第 ${i+1}／${ids.length} 步`}
    ${nx?`· 下一步 <button class="lk" data-goto="${nx}">${nm(nx)}</button>`:'· 已是最后一步'}${back}</div>`;
}
function renderRail(){
  const fl=FLOW(), steps=fl.filter(v=>v.id!=='start'&&!isLater(v.id));
  const done=steps.filter(v=>{try{return v.done();}catch(e){return false;}}).length;
  let i=0;
  $('#rail').innerHTML=`<div class="railhd">${esc(flowLabel())} · 已完成 ${done}/${steps.length}</div>`+
    fl.map(v=>{let d=false;try{d=v.done();}catch(e){}
      const opt=isLater(v.id);
      const no=v.id==='start'?'00':(opt?'—':'0'+(++i));
      return `<button data-id="${v.id}" data-opt="${opt?1:0}" aria-current="${v.id===current()}" data-done="${d?1:0}">
      <span class="n">${no}</span><span style="min-width:0"><span class="t">${v.n}</span><span class="s" title="${esc(v.s)}">${v.s}</span></span></button>`;}).join('');
}
function renderPanel(){
  const id=current(), v=VIEWS.find(x=>x.id===id).make();
  const nav=id==='start'?'':crumb(id);
  $('#panel').innerHTML=`<div class="panel-hd"><h2>${v.title}</h2>`
    +`<p class="lede" title="${esc(v.lede)}">${v.lede}</p>`
    +(v.meta&&v.meta.length?`<div class="meta2">${v.meta.slice(0,3).map(x=>`<span>${x}</span>`).join('')}</div>`:'')
    +`</div><div class="panel-bd">${nav}${v.body}</div>`;
  try{ v.init&&v.init(); }catch(e){ console.error(e); }
  $$('#panel [data-goto]').forEach(b=>{ if(!b.onclick) b.onclick=()=>{ location.hash=b.dataset.goto; }; });
}
function go(){ renderRail(); renderPanel(); window.scrollTo({top:0,behavior:'smooth'}); }
$('#rail').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;
  if(b.dataset.id==='cite') CITE_STD=null; location.hash=b.dataset.id;});
addEventListener('hashchange',go);
MS.title=store.get('ts_title','');
MS.journal=store.get('ts_journal','');
renderDesk();
go();
probe();
</script>
